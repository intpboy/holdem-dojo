<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holdem Dojo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>♠ Holdem Dojo</h1>
    <div id="stats"></div>
    <div class="opts">
      <label>Opponents <select id="optN"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label>Speed <select id="optSpeed"><option value="1.6">Slow</option><option value="1">Normal</option><option value="0.4">Fast</option></select></label>
      <label>Units <select id="optUnit"><option value="chip">Chips</option><option value="bb">BB</option></select></label>
      <label><input type="checkbox" id="optManual"> Step mode</label>
      <label><input type="checkbox" id="optHint"> Equity hint</label>
      <button class="sbtn" id="bNew">New game</button>
      <button class="sbtn" id="bFull">Fullscreen</button>
    </div>
  </header>
  <main>
    <div id="tableWrap"><div id="table">
      <div id="felt"></div>
      <div id="center"><div id="pot"></div><div id="board"></div><div id="msg"></div></div>
      <div id="seats"></div>
    </div></div>
    <div id="controls">
      <div id="hint"></div>
      <div class="row" id="actRow">
        <button class="btn fold" id="bFold">Fold<kbd>F</kbd></button>
        <button class="btn call" id="bCall">Check<kbd>C</kbd></button>
        <button class="btn raise" id="bRaise">Raise<kbd>R</kbd></button>
      </div>
      <div class="row" id="raiseRow">
        <button class="sbtn" data-f="min"><kbd>1</kbd> Min</button>
        <button class="sbtn" data-f="0.33"><kbd>2</kbd> ⅓ pot</button>
        <button class="sbtn" data-f="0.5"><kbd>3</kbd> ½ pot</button>
        <button class="sbtn" data-f="0.67"><kbd>4</kbd> ⅔ pot</button>
        <button class="sbtn" data-f="1"><kbd>5</kbd> Pot</button>
        <button class="sbtn" data-f="max"><kbd>6</kbd> All-in</button>
        <input type="range" id="rSlider" step="10">
        <input type="number" id="rNum" step="10">
      </div>
      <div class="row"><button class="btn next" id="bNext">Start game<kbd>Space</kbd></button></div>
      <div id="keys">F fold · C check/call · R bet/raise · 1-6 sizing · ↑↓ amount (Shift ×5) · Space continue/next hand · U chips/BB · M step mode · H hint</div>
    </div>
  </main>
  <aside>
    <h2>Strategy estimate</h2>
    <div id="gto"></div>
    <h2>Hand log</h2>
    <div id="log"></div>
  </aside>
</div>
<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
